name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests (retrieval logic)
        run: npm test --workspace retriever-api
      - name: Lint
        run: npm run lint
      - name: Build frontend
        run: npm run build
        env:
          # Only needs to be present at build time; not a real endpoint here.
          NEXT_PUBLIC_API_URL: http://localhost:8000

  python:
    name: Ingestion scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r ingestion/requirements.txt
      - name: Byte-compile ingestion and evaluation scripts
        run: python -m compileall -q ingestion

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/retriever-api/Dockerfile -t eldertw-api .

      # Building proves nothing about runtime resolution: npm workspaces can
      # leave an unhoisted package out of the image and the build still passes.
      - name: API image resolves every declared dependency
        run: |
          docker run --rm --entrypoint node eldertw-api -e "
            const deps = Object.keys(require('/app/apps/retriever-api/package.json').dependencies);
            const missing = deps.filter(d => {
              try { require.resolve(d, { paths: ['/app/apps/retriever-api'] }); return false; }
              catch { return true; }
            });
            if (missing.length) { console.error('missing in image: ' + missing.join(', ')); process.exit(1); }
            console.log(deps.length + ' dependencies resolve');
          "

      - name: API image boots and serves /health
        run: |
          docker run -d --name api-ci -p 8000:8000 \
            -e OPENAI_API_KEY=sk-ci-placeholder \
            -e QDRANT_URL=http://127.0.0.1:9999 \
            -e ALLOWED_ORIGINS=https://example.com \
            eldertw-api
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || true)
            # 500 is expected here: Qdrant is unreachable, but the process is up.
            if [ "$code" = "200" ] || [ "$code" = "500" ]; then
              echo "API responded with $code"
              docker rm -f api-ci >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "API never responded; logs:"
          docker logs api-ci
          docker rm -f api-ci >/dev/null
          exit 1
      - name: Build frontend image
        run: docker build -f apps/frontend/Dockerfile --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 -t eldertw-web .
