name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests (retrieval logic)
        run: npm test --workspace retriever-api
      - name: Lint
        run: npm run lint
      - name: Build frontend
        run: npm run build
        env:
          # Only needs to be present at build time; not a real endpoint here.
          NEXT_PUBLIC_API_URL: http://localhost:8000

  python:
    name: Ingestion scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r ingestion/requirements.txt
      - name: Byte-compile ingestion and evaluation scripts
        run: python -m compileall -q ingestion

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/retriever-api/Dockerfile -t eldertw-api .
      - name: Build frontend image
        run: docker build -f apps/frontend/Dockerfile --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 -t eldertw-web .
